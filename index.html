<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Firebase JSON Sync Test</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }
    body {
      margin: 0;
      padding: 24px;
      background: Canvas;
      color: CanvasText;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { margin: 0 0 20px; opacity: .75; }
    .card {
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    input, button {
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
    }
    input {
      min-width: 260px;
      background: Canvas;
      color: CanvasText;
    }
    button { cursor: pointer; }
    .statusbar {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
      padding: 14px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 12px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
      flex: 0 0 auto;
    }
    .dot.ok { background: #1f9d55; }
    .dot.err { background: #d64545; }
    textarea {
      width: 100%;
      min-height: 55vh;
      box-sizing: border-box;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      padding: 14px;
      font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: color-mix(in srgb, Canvas 96%, CanvasText 4%);
      color: inherit;
    }
    textarea:disabled { opacity: .55; }
    .message {
      margin-top: 10px;
      min-height: 1.4em;
      font-size: 14px;
    }
    .error { color: #d64545; }
    .muted { opacity: .7; font-size: 14px; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Firebase JSON Sync Test</h1>
    <p class="sub">Beveiligde test: aanmelden en daarna dezelfde JSON synchroniseren tussen Mac en iPhone.</p>

    <section class="card">
      <div id="loginBox">
        <div class="row">
          <input id="email" type="email" autocomplete="username" placeholder="E-mailadres">
          <input id="password" type="password" autocomplete="current-password" placeholder="Wachtwoord">
          <button id="loginBtn" type="button">Aanmelden</button>
        </div>
        <div class="muted" style="margin-top:8px;">Gebruik het Firebase-account dat je net hebt aangemaakt.</div>
      </div>

      <div id="loggedInBox" hidden>
        <div class="row">
          <strong id="userText"></strong>
          <button id="logoutBtn" type="button">Afmelden</button>
        </div>
      </div>
    </section>

    <section class="statusbar">
      <div class="row">
        <span id="dot" class="dot"></span>
        <strong id="connection">Nog niet aangemeld</strong>
      </div>
      <div id="lastSync">Laatste synchronisatie: —</div>
      <div>Databasepad: <code>test/sharedJson</code></div>
    </section>

    <textarea id="jsonEditor" spellcheck="false" aria-label="Gedeelde JSON" disabled>{}</textarea>
    <div id="message" class="message"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
      getDatabase,
      ref,
      onValue,
      set
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1tdycD-rLDVFQZSReIK4QgHN-m1JGNjA",
      authDomain: "filamentsynctest.firebaseapp.com",
      databaseURL: "https://filamentsynctest-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "filamentsynctest",
      storageBucket: "filamentsynctest.firebasestorage.app",
      messagingSenderId: "672569696347",
      appId: "1:672569696347:web:247fb11fd3d2f663f31f7e"
    };

    const allowedUid = "f1VTVrgUuMgjJ63eM8Av3Lsf6Rg1";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const sharedRef = ref(db, "test/sharedJson");

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const loginBox = document.getElementById("loginBox");
    const loggedInBox = document.getElementById("loggedInBox");
    const userText = document.getElementById("userText");
    const editor = document.getElementById("jsonEditor");
    const dot = document.getElementById("dot");
    const connection = document.getElementById("connection");
    const lastSync = document.getElementById("lastSync");
    const message = document.getElementById("message");

    let applyingRemoteUpdate = false;
    let saveTimer = null;
    let stopListening = null;

    function setStatus(text, state = "idle") {
      connection.textContent = text;
      dot.className = "dot" + (state === "ok" ? " ok" : state === "err" ? " err" : "");
    }

    function stamp(prefix) {
      lastSync.textContent = `${prefix}: ${new Date().toLocaleString("nl-BE")}`;
    }

    function showError(text) {
      message.textContent = text;
      message.className = "message error";
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function startDatabaseListener() {
      if (stopListening) stopListening();

      stopListening = onValue(
        sharedRef,
        (snapshot) => {
          applyingRemoteUpdate = true;
          editor.value = JSON.stringify(snapshot.val() ?? {}, null, 2);
          applyingRemoteUpdate = false;
          clearMessage();
          setStatus("Aangemeld en verbonden met Firebase", "ok");
          stamp("Laatste synchronisatie");
        },
        (error) => {
          setStatus("Firebase-fout", "err");
          showError(error.message);
        }
      );
    }

    loginBtn.addEventListener("click", async () => {
      clearMessage();
      loginBtn.disabled = true;
      try {
        await signInWithEmailAndPassword(auth, email.value.trim(), password.value);
        password.value = "";
      } catch (error) {
        showError(`${error.code}: ${error.message}`);
      } finally {
        loginBtn.disabled = false;
      }
    });

    password.addEventListener("keydown", (event) => {
      if (event.key === "Enter") loginBtn.click();
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (stopListening) {
        stopListening();
        stopListening = null;
      }

      if (!user) {
        loginBox.hidden = false;
        loggedInBox.hidden = true;
        editor.disabled = true;
        setStatus("Nog niet aangemeld");
        return;
      }

      if (user.uid !== allowedUid) {
        signOut(auth);
        setStatus("Geen toegang", "err");
        showError("Dit Firebase-account heeft geen toegang tot deze test.");
        return;
      }

      loginBox.hidden = true;
      loggedInBox.hidden = false;
      userText.textContent = `Aangemeld als ${user.email}`;
      editor.disabled = false;
      setStatus("Aangemeld — verbinden met Firebase…");
      startDatabaseListener();
    });

    editor.addEventListener("input", () => {
      if (applyingRemoteUpdate || !auth.currentUser) return;

      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        let parsed;
        try {
          parsed = JSON.parse(editor.value);
          message.textContent = "JSON geldig — synchroniseren…";
          message.className = "message";
        } catch {
          showError("JSON is niet geldig. Er wordt niets naar Firebase geschreven.");
          return;
        }

        try {
          await set(sharedRef, parsed);
          message.textContent = "Gesynchroniseerd.";
          message.className = "message";
          stamp("Laatste lokale wijziging");
        } catch (error) {
          setStatus("Schrijven naar Firebase mislukt", "err");
          showError(error.message);
        }
      }, 600);
    });
  </script>
</body>
</html>
